<style>
  body { margin: 0; padding: 12px; font: 12px/1.4 Inter, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  h2 { font-size: 11px; font-weight: 600; margin: 0 0 8px; color: var(--figma-color-text-secondary); }
  section + section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--figma-color-border); }
  label { display: block; margin-bottom: 8px; }
  input, textarea { box-sizing: border-box; width: 100%; margin-top: 4px; padding: 6px; font: inherit; color: inherit; background: var(--figma-color-bg); border: 1px solid var(--figma-color-border); border-radius: 4px; }
  textarea { height: 64px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--figma-color-border-selected); outline-offset: -1px; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
  .swatches button { aspect-ratio: 1; border: 1px solid rgba(0,0,0,.15); border-radius: 4px; cursor: pointer; padding: 0; }
  .swatches button[aria-pressed="true"] { outline: 2px solid var(--figma-color-border-selected); outline-offset: 1px; }
  .swatches button:disabled { opacity: .4; cursor: default; }
  #create { width: 100%; padding: 8px; border: 0; border-radius: 6px; font: inherit; font-weight: 600; color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); cursor: pointer; }
  .actions { display: grid; gap: 4px; margin-bottom: 8px; }
  .actions button { padding: 7px; font: inherit; color: var(--figma-color-text); background: var(--figma-color-bg); border: 1px solid var(--figma-color-border); border-radius: 6px; cursor: pointer; }
  .actions button:disabled { opacity: .4; cursor: default; }
  #hint { color: var(--figma-color-text-secondary); margin: 0; }
</style>

<section>
  <h2 data-ja="新規作成">New Note</h2>
  <label><span data-ja="ラベル">Label</span><input id="label" value="memo" /></label>
  <label><span data-ja="本文">Text</span><textarea id="body" placeholder="Enter Text..."></textarea></label>
  <div class="swatches" id="newColors" role="group" aria-label="Color" data-ja-aria="カラー"></div>
  <button id="create" data-ja="生成">Create</button>
</section>

<section>
  <h2 data-ja="選択中のポストイット">Selected Notes</h2>
  <div class="swatches" id="editColors" role="group" aria-label="Change color" data-ja-aria="カラー変更"></div>
  <div class="actions">
    <button id="updateDate" data-ja="日時を更新">Update Date</button>
    <button id="updateAuthor" data-ja="作成者を更新">Update Author</button>
  </div>
  <p id="hint"></p>
</section>

<script>
  const $ = (id) => document.getElementById(id);
  let newColor = null;

  // 英語がデフォルト。日本語環境では data-ja / data-ja-aria の文字列に差し替える
  const ja = navigator.language.startsWith('ja');
  if (ja) {
    for (const el of document.querySelectorAll('[data-ja]')) el.textContent = el.dataset.ja;
    for (const el of document.querySelectorAll('[data-ja-aria]')) el.ariaLabel = el.dataset.jaAria;
  }
  const hint = (count) =>
    ja ? (count ? `${count} 件選択中` : 'ポストイットを選択すると編集できます') : count ? `${count} selected` : 'Select a note to edit';
  $('hint').textContent = hint(0);

  function renderSwatches(el, presets, onClick) {
    el.innerHTML = '';
    for (const p of presets) {
      const b = document.createElement('button');
      b.style.background = '#' + p.hex;
      b.title = b.ariaLabel = p.name;
      b.dataset.hex = p.hex;
      b.onclick = () => onClick(p.hex);
      el.appendChild(b);
    }
  }

  function mark(el, hex) {
    for (const b of el.children) b.ariaPressed = String(b.dataset.hex === hex);
  }

  onmessage = ({ data: { pluginMessage: msg } }) => {
    if (msg.type === 'init') {
      newColor = msg.presets[0].hex;
      renderSwatches($('newColors'), msg.presets, (hex) => mark($('newColors'), (newColor = hex)));
      renderSwatches($('editColors'), msg.presets, (hex) => parent.postMessage({ pluginMessage: { type: 'recolor', color: hex } }, '*'));
      mark($('newColors'), newColor);
    } else if (msg.type === 'selection') {
      for (const b of document.querySelectorAll('#editColors button, .actions button')) b.disabled = msg.count === 0;
      mark($('editColors'), msg.color);
      $('hint').textContent = hint(msg.count);
    }
  };

  for (const type of ['updateDate', 'updateAuthor']) $(type).onclick = () => parent.postMessage({ pluginMessage: { type } }, '*');

  $('create').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'create', label: $('label').value, body: $('body').value, color: newColor } }, '*');
    $('body').value = '';
  };
</script>
